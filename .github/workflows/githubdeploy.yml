
name: VIDHWAAN AI LEARN ENGLISH DEPLOY

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vidhwaan-ailearn-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PROJECT_NAME: ailearn
      NODE_OPTIONS: --max-old-space-size=4096

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ======================================================
      # INSTALL TOOLS
      # ======================================================

      - name: Install Production Tools
        run: |
          set -euo pipefail
          npm install -g terser javascript-obfuscator clean-css-cli html-minifier-terser

      # ======================================================
      # VALIDATE SOURCE
      # ======================================================

      - name: Validate Application
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node --check app.js
          node --check sw.js
          node --check scripts/protect-data.js

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const key = process.env.AIVIDHYA_DATA_KEY;

          if (!key || !/^[A-Za-z0-9+/]+={0,2}$/.test(key)) {
            throw new Error("AIVIDHYA_DATA_KEY is missing or invalid Base64.");
          }

          if (Buffer.from(key, "base64").length !== 32) {
            throw new Error("AIVIDHYA_DATA_KEY must decode to 32 bytes.");
          }

          const required = [
            "index.html",
            "main.css",
            "app.js",
            "sw.js",
            "manifest.json",
            "favicon.ico",
            "icons/logo.png",
            "icons/icon-192.png",
            "icons/icon-512.png",
            "scripts/protect-data.js",
            "data/credentials.json"
          ];

          for (const file of required) {
            if (!fs.existsSync(file)) {
              throw new Error("Missing required file: " + file);
            }
          }

          const lessons = fs.readdirSync("data")
            .filter(f => /^day-\d{3}\.json$/.test(f));

          if (!lessons.length) {
            throw new Error("No day-XXX.json lesson files found.");
          }

          const credentials = JSON.parse(
            fs.readFileSync("data/credentials.json", "utf8")
          );

          if (!Array.isArray(credentials.users) || !credentials.users.length) {
            throw new Error("credentials.json must contain users.");
          }

          const app = fs.readFileSync("app.js", "utf8");

          if (!app.includes("__AIVIDHYA_DATA_KEY__")) {
            throw new Error("Encryption key placeholder missing in app.js.");
          }

          console.log("Lessons:", lessons.length);
          console.log("Users:", credentials.users.length);
          console.log("Source validation passed.");
          NODE

      # ======================================================
      # PREPARE DIST
      # ======================================================

      - name: Prepare Dist
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/data

          cp index.html dist/
          cp main.css dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp favicon.ico dist/
          cp -r icons dist/

          echo "ailearn.vidhwaan.com" > dist/CNAME

          echo "Dist prepared."
          find dist -maxdepth 2 -type f

      # ======================================================
      # PROTECT LESSONS
      # ======================================================

      - name: Protect Lesson Data
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node scripts/protect-data.js

          echo "Lesson protection completed."

          find dist/data -maxdepth 1 -type f -name 'day-*.dat' -print

      # ======================================================
      # ENCRYPT LOGIN CREDENTIALS
      # ======================================================

      - name: Encrypt Login Credentials
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import zlib from "node:zlib";

          const key = Buffer.from(
            process.env.AIVIDHYA_DATA_KEY,
            "base64"
          );

          if (key.length !== 32) {
            throw new Error("Invalid AES-256 key.");
          }

          const source = fs.readFileSync(
            "data/credentials.json",
            "utf8"
          );

          const credentials = JSON.parse(source);

          if (!Array.isArray(credentials.users)) {
            throw new Error("Invalid credentials.json structure.");
          }

          const compressed = zlib.gzipSync(
            Buffer.from(JSON.stringify(credentials), "utf8"),
            { level: 9 }
          );

          const iv = crypto.randomBytes(12);

          const cipher = crypto.createCipheriv(
            "aes-256-gcm",
            key,
            iv
          );

          const encrypted = Buffer.concat([
            cipher.update(compressed),
            cipher.final()
          ]);

          const tag = cipher.getAuthTag();

          const output = Buffer.concat([
            iv,
            tag,
            encrypted
          ]);

          fs.writeFileSync(
            "dist/data/credentials.dat",
            output
          );

          console.log("credentials.dat created.");
          console.log("AES-256-GCM + GZIP encryption completed.");
          NODE

          test -s dist/data/credentials.dat

      # ======================================================
      # INJECT DECRYPTION KEY
      # ======================================================

      - name: Inject Decryption Key
        env:
          AIVIDHYA_DATA_KEY: ${{ secrets.AIVIDHYA_DATA_KEY }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/app.js";
          const key = process.env.AIVIDHYA_DATA_KEY;
          const placeholder = "__AIVIDHYA_DATA_KEY__";

          if (!key || Buffer.from(key, "base64").length !== 32) {
            throw new Error("Invalid encryption key.");
          }

          let source = fs.readFileSync(file, "utf8");

          const count = source.split(placeholder).length - 1;

          if (count < 1) {
            throw new Error("No encryption key placeholder found.");
          }

          source = source.replaceAll(
            `"${placeholder}"`,
            JSON.stringify(key)
          );

          source = source.replaceAll(
            placeholder,
            key
          );

          if (source.includes(placeholder)) {
            throw new Error("Key replacement failed.");
          }

          fs.writeFileSync(file, source, "utf8");

          console.log(`Encryption key injected (${count} occurrence(s)).`);
          NODE

          node --check dist/app.js

      # ======================================================
      # MINIFY HTML
      # ======================================================

      - name: Minify HTML
        run: |
          set -euo pipefail

          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            dist/index.html \
            -o dist/index.html

      # ======================================================
      # HTML SINGLE LINE
      # ======================================================

      - name: Make HTML Single Line
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/index.html";

          fs.writeFileSync(
            file,
            fs.readFileSync(file, "utf8")
              .replace(/[\r\n]/g, "")
              .trim()
          );
          NODE

      # ======================================================
      # MINIFY CSS
      # ======================================================

      - name: Minify CSS
        run: |
          set -euo pipefail

          cleancss -O2 dist/main.css -o dist/main.css

      # ======================================================
      # CSS SINGLE LINE
      # ======================================================

      - name: Make CSS Single Line
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/main.css";

          fs.writeFileSync(
            file,
            fs.readFileSync(file, "utf8")
              .replace(/[\r\n]/g, "")
              .trim()
          );
          NODE

      # ======================================================
      # MINIFY JAVASCRIPT
      # ======================================================

      - name: Minify JavaScript
        run: |
          set -euo pipefail

          terser dist/app.js \
            --compress \
            --mangle \
            -o dist/app.js

      # ======================================================
      # OBFUSCATE JAVASCRIPT
      # ======================================================

      - name: Obfuscate JavaScript
        run: |
          set -euo pipefail

          javascript-obfuscator dist/app.js \
            --output dist/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.2 \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending true \
            --split-strings true \
            --string-array true \
            --string-array-encoding base64

      # ======================================================
      # VERIFY KEY
      # ======================================================

      - name: Verify Decryption Key
        run: |
          set -euo pipefail

          if grep -Fq '__AIVIDHYA_DATA_KEY__' dist/app.js; then
            echo "ERROR: Key placeholder remains."
            exit 1
          fi

          echo "Decryption key injection passed."

      # ======================================================
      # CACHE VERSION
      # ======================================================

      - name: Generate Asset Version
        run: |
          set -euo pipefail

          VERSION=$(date +%s)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Asset version: $VERSION"

      # ======================================================
      # CACHE BUSTING
      # ======================================================

      - name: Apply Asset Cache Busting
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "dist/index.html";
          const version = process.env.VERSION;

          let html = fs.readFileSync(file, "utf8");

          html = html.replace(
            /href=["'](?:\.\/)?main\.css(?:\?[^"']*)?["']/g,
            `href="./main.css?v=${version}"`
          );

          html = html.replace(
            /src=["'](?:\.\/)?app\.js(?:\?[^"']*)?["']/g,
            `src="./app.js?v=${version}"`
          );

          html = html.replace(
            /href=["'](?:\.\/)?manifest\.json(?:\?[^"']*)?["']/g,
            `href="./manifest.json?v=${version}"`
          );

          fs.writeFileSync(file, html, "utf8");

          console.log("Cache busting applied.");
          NODE

      # ======================================================
      # VERIFY HTML AND CSS
      # ======================================================

      - name: Verify HTML and CSS
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          for (const file of ["dist/index.html", "dist/main.css"]) {
            const content = fs.readFileSync(file, "utf8");

            if (/[\r\n]/.test(content)) {
              throw new Error(`${file} is not single-line.`);
            }

            console.log(`Verified: ${file}`);
          }
          NODE

      # ======================================================
      # VERIFY PRODUCTION BUILD
      # ======================================================

      - name: Verify Production Build
        run: |
          set -euo pipefail

          SOURCE_COUNT=$(find data -maxdepth 1 -type f -name 'day-*.json' | wc -l)

          LESSON_DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name 'day-*.dat' | wc -l)

          TOTAL_DAT_COUNT=$(find dist/data -maxdepth 1 -type f -name '*.dat' | wc -l)

          JSON_COUNT=$(find dist/data -maxdepth 1 -type f -name '*.json' | wc -l)

          echo "Source lessons      : $SOURCE_COUNT"
          echo "Protected lessons   : $LESSON_DAT_COUNT"
          echo "Total DAT files     : $TOTAL_DAT_COUNT"
          echo "Plain JSON files    : $JSON_COUNT"

          test "$LESSON_DAT_COUNT" -eq "$SOURCE_COUNT"
          test "$TOTAL_DAT_COUNT" -eq "$((SOURCE_COUNT + 1))"
          test "$JSON_COUNT" -eq 0

          test -s dist/data/credentials.dat

          for file in \
            dist/index.html \
            dist/main.css \
            dist/app.js \
            dist/sw.js \
            dist/manifest.json \
            dist/favicon.ico \
            dist/CNAME \
            dist/icons/logo.png \
            dist/icons/icon-192.png \
            dist/icons/icon-512.png
          do
            test -s "$file"
          done

          echo "Production verification passed."

          echo
          echo "PROTECTED DATA:"
          ls -lh dist/data/*.dat

          echo
          echo "BUILD SIZE:"
          du -sh dist

      # ======================================================
      # CONFIGURE GITHUB PAGES
      # ======================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ======================================================
      # UPLOAD ARTIFACT
      # ======================================================

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # ======================================================
      # DEPLOY
      # ======================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ======================================================
      # VERIFY LIVE CREDENTIALS
      # ======================================================

      - name: Verify Deployed Credentials Endpoint
        run: |
          set -euo pipefail

          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          URL="${BASE_URL%/}/data/credentials.dat"

          echo "Checking:"
          echo "$URL"

          for attempt in {1..12}; do

            HTTP_CODE=$(curl \
              --location \
              --silent \
              --show-error \
              --output /tmp/credentials.dat \
              --write-out "%{http_code}" \
              "$URL" || true)

            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/credentials.dat ]; then
              echo "HTTP status: $HTTP_CODE"
              ls -lh /tmp/credentials.dat
              echo "Live credentials endpoint verified."
              exit 0
            fi

            echo "Attempt $attempt: HTTP $HTTP_CODE"
            sleep 5
          done

          echo "ERROR: Credentials endpoint verification failed."
          echo "$URL"
          echo "HTTP status: $HTTP_CODE"

          exit 1

      # ======================================================
      # SUCCESS
      # ======================================================

      - name: Deployment Success
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " VIDHWAAN AI LEARN ENGLISH DEPLOYMENT SUCCESS"
          echo "=============================================="
          echo "Project : $PROJECT_NAME"
          echo "Version : $VERSION"
          echo "Domain  : ailearn.vidhwaan.com"
          echo "----------------------------------------------"
          echo "✓ Login credentials encrypted"
          echo "✓ Lesson JSON encrypted"
          echo "✓ credentials.dat generated"
          echo "✓ credentials.dat deployed"
          echo "✓ Plain JSON excluded from dist"
          echo "✓ HTML/CSS single-line"
          echo "✓ JavaScript minified and obfuscated"
          echo "✓ Cache busting applied"
          echo "✓ PWA deployment completed"
          echo "=============================================="
